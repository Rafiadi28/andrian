; ==========================================================
; PHP Settings untuk LiteSpeed / FastCGI (Hostinger)
; File ini diperlukan karena php_value di .htaccess TIDAK
; berlaku saat PHP berjalan sebagai FastCGI/LiteSpeed.
; ==========================================================

display_errors = Off
log_errors = On
error_log = logs/php_error.log

upload_max_filesize = 15M
post_max_size = 20M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M

session.cookie_httponly = 1
session.use_strict_mode = 1
